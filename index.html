<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 CineMagic · Book Your Show</title>
    <!-- Google Font & Font Awesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0f1c 0%, #1a1f33 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* main card */
        .booking-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(18, 24, 38, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 48px;
            padding: 30px 35px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 180, 50, 0.1) inset;
            transition: all 0.3s ease;
        }

        /* header section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.4));
        }

        .logo-text h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .movie-pill {
            background: rgba(251, 191, 36, 0.15);
            padding: 10px 22px;
            border-radius: 40px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            backdrop-filter: blur(4px);
        }

        .movie-pill i {
            font-size: 1.1rem;
        }

        /* movie info row */
        .movie-info {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 32px;
            padding: 22px 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            align-items: center;
            justify-content: space-between;
        }

        .movie-detail {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .poster-badge {
            width: 70px;
            height: 90px;
            background: linear-gradient(145deg, #2a324a, #1e2538);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }

        .movie-title h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .movie-meta {
            display: flex;
            gap: 15px;
            margin-top: 6px;
            color: #a0aec0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .movie-meta i {
            color: #fbbf24;
            margin-right: 5px;
        }

        .showtime-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 8px 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .showtime-selector label {
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .showtime-selector select {
            background: #0f1422;
            border: none;
            color: #fbbf24;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            border: 1px solid rgba(251, 191, 36, 0.3);
            transition: 0.2s;
        }

        .showtime-selector select:hover {
            background: #1a1f33;
            border-color: #fbbf24;
        }

        /* screen visual */
        .screen-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .screen {
            background: linear-gradient(180deg, #fbbf24 0%, #b45309 100%);
            height: 12px;
            width: 70%;
            margin: 0 auto 10px;
            border-radius: 50%;
            box-shadow: 0 0 35px #fbbf24, 0 0 15px #f59e0b;
            opacity: 0.9;
            transform: perspective(300px) rotateX(5deg);
        }

        .screen-label {
            color: #cbd5e1;
            font-size: 0.85rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 10px;
        }

        /* seat grid */
        .seat-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .seat {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #1e243b;
            border: 1.5px solid #2d344b;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
        }

        .seat i {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .seat.available:hover {
            background: #2d344b;
            border-color: #fbbf24;
            color: #fbbf24;
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(251, 191, 36, 0.4);
        }

        .seat.selected {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
            color: #0b0f1c;
            font-weight: 700;
            transform: scale(1.02);
            box-shadow: 0 0 22px #fbbf24, 0 0 8px #f59e0b;
        }

        .seat.selected i {
            color: #0b0f1c;
            opacity: 1;
        }

        .seat.occupied {
            background: #111625;
            border-color: #1e2538;
            color: #3a4358;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        .seat.occupied i {
            opacity: 0.3;
        }

        /* legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-bottom: 30px;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-box {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            background: #1e243b;
            border: 1.5px solid #2d344b;
        }

        .legend-box.selected {
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
        }

        .legend-box.occupied {
            background: #111625;
            border-color: #1e2538;
            opacity: 0.6;
        }

        /* booking footer */
        .booking-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 18px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 20px;
        }

        .selection-summary {
            display: flex;
            gap: 35px;
            align-items: center;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .summary-value {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .summary-value small {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 400;
        }

        .book-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            padding: 16px 40px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.15rem;
            color: #0b0f1c;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
            letter-spacing: 0.5px;
        }

        .book-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 18px 30px rgba(251, 191, 36, 0.4);
            background: linear-gradient(135deg, #fcd34d, #fbbf24);
        }

        .book-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* toast message */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e243b;
            color: #fbbf24;
            padding: 16px 32px;
            border-radius: 60px;
            font-weight: 600;
            border: 1px solid #fbbf24;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* responsive */
        @media (max-width: 700px) {
            .booking-container {
                padding: 22px 18px;
                border-radius: 32px;
            }
            .movie-info {
                flex-direction: column;
                align-items: flex-start;
            }
            .showtime-selector {
                width: 100%;
                justify-content: space-between;
            }
            .seat {
                width: 38px;
                height: 38px;
                font-size: 0.7rem;
                border-radius: 10px;
            }
            .row {
                gap: 6px;
            }
            .booking-footer {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .selection-summary {
                justify-content: center;
            }
            .book-btn {
                justify-content: center;
            }
            .screen {
                width: 90%;
            }
            .legend {
                gap: 18px;
                font-size: 0.8rem;
            }
            .legend-box {
                width: 18px;
                height: 18px;
            }
        }

        @media (max-width: 450px) {
            .seat {
                width: 32px;
                height: 32px;
                font-size: 0.6rem;
                border-radius: 8px;
            }
            .row {
                gap: 4px;
            }
            .movie-title h2 {
                font-size: 1.4rem;
            }
            .logo-text h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="booking-container">
    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-film"></i></div>
            <div class="logo-text">
                <h1>CineMagic</h1>
                <span>PREMIUM CINEMAS</span>
            </div>
        </div>
        <div class="movie-pill">
            <i class="fas fa-ticket-alt"></i> Now Booking
        </div>
    </div>

    <!-- Movie Info -->
    <div class="movie-info">
        <div class="movie-detail">
            <div class="poster-badge">
                <i class="fas fa-video"></i>
            </div>
            <div class="movie-title">
                <h2>Dune: Part Two</h2>
                <div class="movie-meta">
                    <span><i class="fas fa-clock"></i> 2h 46m</span>
                    <span><i class="fas fa-star"></i> 8.8/10</span>
                    <span><i class="fas fa-globe"></i> IMAX</span>
                </div>
            </div>
        </div>
        <div class="showtime-selector">
            <label for="showtime"><i class="fas fa-calendar-alt"></i> Showtime</label>
            <select id="showtime">
                <option value="10:30">10:30 AM</option>
                <option value="14:15" selected>02:15 PM</option>
                <option value="18:45">06:45 PM</option>
                <option value="22:00">10:00 PM</option>
            </select>
        </div>
    </div>

    <!-- Screen -->
    <div class="screen-area">
        <div class="screen"></div>
        <div class="screen-label">SCREEN</div>
    </div>

    <!-- Seat Grid -->
    <div class="seat-grid" id="seatGrid">
        <!-- Rows will be generated by JavaScript -->
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-box"></div>
            <span>Available</span>
        </div>
        <div class="legend-item">
            <div class="legend-box selected"></div>
            <span>Selected</span>
        </div>
        <div class="legend-item">
            <div class="legend-box occupied"></div>
            <span>Occupied</span>
        </div>
    </div>

    <!-- Booking Footer -->
    <div class="booking-footer">
        <div class="selection-summary">
            <div class="summary-item">
                <span class="summary-label">Seats</span>
                <span class="summary-value" id="selectedSeatsCount">0</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Total</span>
                <span class="summary-value" id="totalPrice">$0</span>
            </div>
        </div>
        <button class="book-btn" id="bookBtn" disabled>
            <i class="fas fa-check-circle"></i> Confirm Booking
        </button>
    </div>
</div>

<!-- Toast notification -->
<div class="toast-message" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastText">Seats booked successfully! 🎉</span>
</div>

<script>
    (function() {
        // ---------- CONFIG ----------
        const ROWS = 6;               // number of rows
        const SEATS_PER_ROW = 10;     // seats per row
        const PRICE_PER_SEAT = 14;    // USD

        // Pre-occupied seats (e.g., some random seats already taken)
        const OCCUPIED_SEATS = [
            'A3', 'A4', 'A7', 'B2', 'B5', 'B8', 'C1', 'C6', 'C9',
            'D4', 'D5', 'E7', 'E8', 'F2', 'F9', 'F10'
        ];

        // ---------- STATE ----------
        let selectedSeats = new Set();  // holds seat labels like "A1", "B5"

        // ---------- DOM ELEMENTS ----------
        const seatGrid = document.getElementById('seatGrid');
        const selectedSeatsCountEl = document.getElementById('selectedSeatsCount');
        const totalPriceEl = document.getElementById('totalPrice');
        const bookBtn = document.getElementById('bookBtn');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');

        // ---------- RENDER SEAT GRID ----------
        function renderSeats() {
            seatGrid.innerHTML = '';

            // Row labels from A to F (A=0, B=1 ...)
            for (let r = 0; r < ROWS; r++) {
                const rowLabel = String.fromCharCode(65 + r); // 'A', 'B', ...
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                // seat numbers 1..SEATS_PER_ROW
                for (let s = 1; s <= SEATS_PER_ROW; s++) {
                    const seatId = `${rowLabel}${s}`;
                    const seatDiv = document.createElement('div');
                    seatDiv.className = 'seat';

                    // check if occupied
                    if (OCCUPIED_SEATS.includes(seatId)) {
                        seatDiv.classList.add('occupied');
                        seatDiv.innerHTML = `<i class="fas fa-times"></i>`;
                    } else {
                        seatDiv.classList.add('available');
                        seatDiv.innerHTML = `<i class="fas fa-chair"></i>`;
                    }

                    // if this seat is selected (shouldn't be on first render unless state persists)
                    if (selectedSeats.has(seatId)) {
                        seatDiv.classList.add('selected');
                        seatDiv.classList.remove('available');
                        seatDiv.innerHTML = `<i class="fas fa-check"></i>`;
                    }

                    // store seat id
                    seatDiv.dataset.seatId = seatId;

                    // add click event (only if not occupied)
                    if (!seatDiv.classList.contains('occupied')) {
                        seatDiv.addEventListener('click', () => toggleSeat(seatDiv, seatId));
                    }

                    rowDiv.appendChild(seatDiv);
                }

                seatGrid.appendChild(rowDiv);
            }
        }

        // ---------- TOGGLE SEAT SELECTION ----------
        function toggleSeat(seatElement, seatId) {
            if (seatElement.classList.contains('occupied')) return;

            if (selectedSeats.has(seatId)) {
                // Deselect
                selectedSeats.delete(seatId);
                seatElement.classList.remove('selected');
                seatElement.classList.add('available');
                seatElement.innerHTML = `<i class="fas fa-chair"></i>`;
            } else {
                // Select (limit to 8 seats for sanity)
                if (selectedSeats.size >= 8) {
                    showToast('You can select up to 8 seats only.', '⚠️');
                    return;
                }
                selectedSeats.add(seatId);
                seatElement.classList.remove('available');
                seatElement.classList.add('selected');
                seatElement.innerHTML = `<i class="fas fa-check"></i>`;
            }

            updateSummary();
        }

        // ---------- UPDATE SUMMARY (count & total) ----------
        function updateSummary() {
            const count = selectedSeats.size;
            selectedSeatsCountEl.textContent = count;

            const total = count * PRICE_PER_SEAT;
            totalPriceEl.textContent = `$${total}`;

            // Enable/disable book button
            bookBtn.disabled = count === 0;
        }

        // ---------- SHOW TOAST MESSAGE ----------
        function showToast(message, icon = '🎉') {
            // change icon if needed (simple text prefix)
            toastText.textContent = message;
            // change icon inside toast
            const iconEl = toast.querySelector('i');
            if (iconEl) {
                if (icon.includes('⚠️')) {
                    iconEl.className = 'fas fa-exclamation-triangle';
                } else {
                    iconEl.className = 'fas fa-check-circle';
                }
            }

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3200);
        }

        // ---------- BOOK BUTTON HANDLER ----------
        function handleBooking() {
            if (selectedSeats.size === 0) return;

            const seatList = Array.from(selectedSeats).sort().join(', ');
            const total = selectedSeats.size * PRICE_PER_SEAT;
            const showtime = document.getElementById('showtime').value;
            const formattedTime = formatShowtime(showtime);

            // Simulate booking (clear selection and mark as occupied? For realism, 
            // we could mark them occupied, but for UX we'll just reset and show success)
            // Let's also update the OCCUPIED_SEATS array and re-render to keep it consistent.
            selectedSeats.forEach(seatId => {
                if (!OCCUPIED_SEATS.includes(seatId)) {
                    OCCUPIED_SEATS.push(seatId);
                }
            });

            // Clear selected set
            selectedSeats.clear();

            // Re-render seat grid with new occupied seats
            renderSeats();
            updateSummary();

            // Show success toast
            showToast(`Booked ${seatList} for ${formattedTime} · Total $${total}`, '🎉');
        }

        // helper to format time
        function formatShowtime(value) {
            const [hour, minute] = value.split(':');
            const h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${minute} ${ampm}`;
        }

        // ---------- INITIAL RENDER & EVENT LISTENERS ----------
        function init() {
            renderSeats();
            updateSummary();

            // Book button click
            bookBtn.addEventListener('click', handleBooking);

            // Showtime change doesn't affect seats, but we could log or show toast on change
            document.getElementById('showtime').addEventListener('change', (e) => {
                // optional: show a tiny info toast
                showToast(`Showtime updated to ${formatShowtime(e.target.value)}`, '🕒');
            });
        }

        init();
    })();
</script>
</body>
</html>
